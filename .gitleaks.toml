# Default rules, plus an allowlist for the obviously fake tokens the tests use.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures"
paths = [
  '''ncaa-soccer/apps/api/test/''',
  '''ncaa-soccer/apps/worker/test/''',
  '''ncaa-soccer/packages/database/test/''',
]

# Public reCAPTCHA site keys that athletics websites embed in every page they serve,
# captured in saved third-party HTML (raw scrapes, parser fixtures). They are public by
# design and not NcaDB credentials. `dedupe_key` is a column name.
regexTarget = "match"
regexes = [
  '''captchaKey"?\s*[:=]''',
  '''sitekey"?\s*[:=]''',
  '''dedupe_key''',
]
