<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Elo ratings, week-by-week match forecasts and player impact for NCAA Division I men's soccer — The Collegiate Tribune."
    />
    <title>The Collegiate Tribune — NCAA Division I Soccer Chronicle</title>
  </head>
  <body>
    <!--
      Shown until the app mounts, so the page is never empty. If the script cannot load
      or run (blocked, offline, an extension), the second line appears after a few
      seconds via CSS alone: no inline script, so it works under the site's CSP.
    -->
    <div id="root">
      <div class="boot" role="status">
        <p class="boot-title">College Soccer Lab</p>
        <p>Loading NCAA Division I men’s soccer data…</p>
        <p class="boot-slow">
          Still loading? Reload the page. If this persists, a browser extension or network
          filter may be blocking the site’s scripts.
        </p>
        <noscript><p>This site needs JavaScript to show its data.</p></noscript>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
