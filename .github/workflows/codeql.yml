# Static analysis (SAST) of the TypeScript code: injection, unsafe deserialisation,
# SSRF and similar patterns. Results appear under Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3.38.3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths-ignore:
              - ncaa-soccer/data
              - ncaa-soccer/apps/scraper/src/scripts/archive
              - '**/__fixtures__'
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
