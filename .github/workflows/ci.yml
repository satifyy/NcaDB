# Runs on every pull request and on main. Nothing here deploys: Railway (API, worker)
# and Vercel (dashboard) deploy from main through their GitHub integrations, and only
# after this workflow is green if branch protection requires it (see docs/DEPLOYMENT.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

# Read-only by default. Pull requests from forks run with no secrets and this token only;
# nothing in CI deploys or holds production credentials.
permissions:
  contents: read

defaults:
  run:
    working-directory: ncaa-soccer

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ncadb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ncadb_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `apps/dashboard/src/data` used to be 72 MB of generated JSON committed by hand.
      # The dashboard now reads it from the API; it must never come back into git.
      - name: No generated dashboard data in git
        run: |
          tracked=$(git ls-files apps/dashboard/src/data)
          if [ -n "$tracked" ]; then
            echo "::error::Generated dashboard data is tracked."
            echo "$tracked"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ncaa-soccer/package-lock.json

      - run: npm ci

      - name: Typecheck (packages, scraper, worker, API)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Migrations applied from scratch, then loader, API and worker CLI against a real
      # Postgres: idempotency, corrections, rollback, locking, failure and retry.
      - name: Database, API and worker tests
        run: npm run test:db

      - name: Validate team inventories
        run: npm run validate

      # Fails on any known high or critical advisory in what ships (dev tooling included,
      # since the worker image runs TypeScript through tsx).
      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Lint dashboard
        run: npm run lint
        working-directory: ncaa-soccer/apps/dashboard

      - name: Build dashboard
        run: npm run build
        working-directory: ncaa-soccer/apps/dashboard
        env:
          VITE_API_BASE_URL: https://api.example.invalid

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # New dependencies a pull request introduces, checked against known advisories.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
